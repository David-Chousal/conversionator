<!-- @dsCard group="Reports" height=560 subtitle="Build, preview, export and schedule a combined report" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>ReportComposer — preview</title></head>
<body>
<div class="cor-pad">
  <section class="cor-bay">
    <div class="cor-bay__head"><h3 class="cor-bay__title">New report</h3><span class="cor-tag">Draft · autosaved 9:51</span></div>
    <div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,300px);gap:var(--space-8);align-items:start">
      <div style="display:grid;gap:var(--space-6)">
        <label class="cor-fieldset"><span class="cor-fieldset__label"><span class="cor-tag">Name</span></span><input class="cor-input" id="rc-name" value="March performance · all channels"></label>
        <div class="cor-step"><span class="cor-tag">1 · Metrics</span><span class="cor-tokens"><span class="cor-token">Spend<button type="button" aria-label="Remove"><svg class="cor-ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 3.5l9 9 M12.5 3.5l-9 9"/></svg></button></span><span class="cor-token">Revenue<button type="button" aria-label="Remove"><svg class="cor-ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 3.5l9 9 M12.5 3.5l-9 9"/></svg></button></span><span class="cor-token">ROAS<button type="button" aria-label="Remove"><svg class="cor-ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 3.5l9 9 M12.5 3.5l-9 9"/></svg></button></span><span class="cor-token">CPA<button type="button" aria-label="Remove"><svg class="cor-ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 3.5l9 9 M12.5 3.5l-9 9"/></svg></button></span><input id="rc-m" placeholder="Add metric…"></span></div>
        <div class="cor-step"><span class="cor-tag">2 · Sources</span><div class="cor-toggles"><button class="cor-toggle" type="button" aria-pressed="true"><span class="box" style="background:var(--ch-1)"></span>Google Ads</button><button class="cor-toggle" type="button" aria-pressed="true"><span class="box" style="background:var(--ch-2)"></span>Meta Ads</button><button class="cor-toggle" type="button" aria-pressed="true"><span class="box" style="background:var(--ch-3)"></span>LinkedIn Ads</button><button class="cor-toggle" type="button" aria-pressed="false"><span class="box" style="background:var(--ch-4)"></span>TikTok Ads</button></div></div>
        <div class="cor-step"><span class="cor-tag">3 · Window</span><button class="cor-input cor-input--select" type="button" style="max-width:320px"><svg class="cor-ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 3.5h11v10h-11z M2.5 6.5h11 M5.5 2v3 M10.5 2v3"/></svg> Mar 1 → Mar 31, 2026 · vs Feb <svg class="cor-ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg></button></div>
        <div class="cor-step"><span class="cor-tag">4 · Deliver</span><div class="cor-row"><div class="cor-seg" role="group" aria-label="Format"><button type="button" aria-pressed="true">PDF</button><button type="button" aria-pressed="false">CSV</button></div><div class="cor-seg" role="group" aria-label="Schedule"><button type="button" aria-pressed="false">Once</button><button type="button" aria-pressed="false">Weekly</button><button type="button" aria-pressed="true">Monthly</button></div><span class="cor-tag">1st of each month · 8:00 PT</span></div>
          <span class="cor-tokens"><span class="cor-token">maria@northwind.co<button type="button" aria-label="Remove"><svg class="cor-ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 3.5l9 9 M12.5 3.5l-9 9"/></svg></button></span><span class="cor-token">cfo@northwind.co<button type="button" aria-label="Remove"><svg class="cor-ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 3.5l9 9 M12.5 3.5l-9 9"/></svg></button></span><input id="rc-r" placeholder="Add recipient…"></span></div>
        <div class="cor-row" style="gap:var(--space-2)"><button class="cor-key cor-key--primary" type="button"><svg class="cor-ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v8 M4.5 6.5L8 10l3.5-3.5 M2.5 13.5h11"/></svg>Export PDF <kbd>⌘⏎</kbd></button><button class="cor-key" type="button">Save schedule</button></div>
      </div>
      <figure style="margin:0;display:grid;gap:var(--space-2)"><span class="cor-tag">Preview · page 1 of 3</span>
        <div class="cor-paper" data-theme="light" aria-label="Report preview">
          <span style="font:700 14px/1 var(--font-sans);letter-spacing:-.04em">COR <span class="cor-tag" style="font-size:8px">Northwind</span></span>
          <span style="font:700 15px/18px var(--font-sans)">March performance</span>
          <span class="cor-tag" style="font-size:8px">Mar 1 → Mar 31 · Google, Meta, LinkedIn</span>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;border-top:2px solid var(--rail);padding-top:6px"><span><span class="cor-tag" style="font-size:7px">Spend</span><br><b style="font:700 16px var(--font-sans)">$48.2k</b></span><span><span class="cor-tag" style="font-size:7px">ROAS</span><br><b style="font:700 16px var(--font-sans)">4.1×</b></span></div>
          <div style="display:grid;gap:4px;border-top:2px solid var(--rail);padding-top:6px"><span style="height:5px;width:90%;background:var(--ch-1)"></span><span style="height:5px;width:52%;background:var(--ch-2)"></span><span style="height:5px;width:22%;background:var(--ch-3)"></span></div>
          <span class="cor-skel" style="height:4px;width:80%"></span><span class="cor-skel" style="height:4px;width:65%"></span>
        </div></figure>
    </div>
  </section>
</div>
</body>
</html>
