<!doctype html>
<html>
<head><meta charset="utf-8"><title>SignalMeter — preview</title></head>
<body>
<div class="cor-pad cor-row" style="gap:var(--space-8)">
  <span class="cor-signal cor-signal--ok"><span class="cor-signal__bars"><i></i><i></i><i></i><i></i></span>Synced <b>4m</b></span>
  <span class="cor-signal cor-signal--stale"><span class="cor-signal__bars"><i></i><i></i><i class="off"></i><i class="off"></i></span>Stale <b>6h</b></span>
  <span class="cor-signal cor-signal--failed"><span class="cor-signal__bars"><i class="off"></i><i class="off"></i><i class="off"></i><i class="off"></i></span>Failed <b>9:42 AM</b></span>
  <span class="cor-signal cor-signal--off"><span class="cor-signal__bars"><i class="off"></i><i class="off"></i><i class="off"></i><i class="off"></i></span>Paused</span>
</div>
</body>
</html>
