<!doctype html>
<html>
<head><meta charset="utf-8"><title>ShareRing — preview</title></head>
<body>
<div class="cor-pad">
  <section class="cor-bay" style="max-width:560px">
    <div class="cor-bay__head"><h3 class="cor-bay__title">Share of spend</h3><span class="cor-tag">Mar 1 → Mar 30</span></div>
    <div style="display:flex;flex-wrap:wrap;gap:var(--space-8);align-items:center">
      <svg class="cor-ring" viewBox="0 0 120 120" role="img" aria-label="Share of spend: Google Ads 44%, Meta Ads 31%, LinkedIn Ads 18%, TikTok Ads 7%.">
        <g transform="rotate(-90 60 60)" fill="none" stroke-width="12">
          <circle cx="60" cy="60" r="40" style="stroke:var(--ch-1)" stroke-dasharray="109.6 251.3" stroke-dashoffset="0"/>
          <circle cx="60" cy="60" r="40" style="stroke:var(--ch-2)" stroke-dasharray="75.7 251.3" stroke-dashoffset="-111.6"/>
          <circle cx="60" cy="60" r="40" style="stroke:var(--ch-3)" stroke-dasharray="43 251.3" stroke-dashoffset="-189.3"/>
          <circle cx="60" cy="60" r="40" style="stroke:var(--ch-4)" stroke-dasharray="15.1 251.3" stroke-dashoffset="-234.3"/>
        </g>
        <text class="cor-ring__center" x="60" y="61" text-anchor="middle">$48.2k</text><text class="cor-ring__sub" x="60" y="72" text-anchor="middle">TOTAL SPEND</text>
      </svg>
      <div class="cor-keylist" style="flex:1;min-width:220px">
        <div><i style="background:var(--ch-1)"></i>Google Ads<span class="cor-num">$21.4k</span><span class="cor-num" style="color:var(--ink)">44%</span></div>
        <div><i style="background:var(--ch-2)"></i>Meta Ads<span class="cor-num">$14.9k</span><span class="cor-num" style="color:var(--ink)">31%</span></div>
        <div><i style="background:var(--ch-3)"></i>LinkedIn Ads<span class="cor-num">$8.6k</span><span class="cor-num" style="color:var(--ink)">18%</span></div>
        <div><i style="background:var(--ch-4)"></i>TikTok Ads<span class="cor-num">$3.3k</span><span class="cor-num" style="color:var(--ink)">7%</span></div>
      </div>
    </div>
  </section>
</div>
</body>
</html>
