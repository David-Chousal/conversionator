<!-- @dsCard group="Overlays" height=300 subtitle="Bay and row action menu" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Menu — preview</title></head>
<body>
<div class="cor-pad" style="display:flex;gap:var(--space-8);flex-wrap:wrap;align-items:flex-start">
  <div class="cor-menu" role="menu" aria-label="Spend by channel actions">
    <button class="cor-menu__item" role="menuitem"><svg class="cor-ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 8S4 3.5 8 3.5 14.5 8 14.5 8 12 12.5 8 12.5 1.5 8 1.5 8z M8 10a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"/></svg>Open breakdown<kbd>⏎</kbd></button>
    <button class="cor-menu__item" role="menuitem"><svg class="cor-ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v8 M4.5 6.5L8 10l3.5-3.5 M2.5 13.5h11"/></svg>Export CSV<kbd>⇧E</kbd></button>
    <button class="cor-menu__item" role="menuitem"><svg class="cor-ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 11V7a4 4 0 0 1 8 0v4l1 1.5H3z M6.5 14.5h3"/></svg>Create alert from this</button>
    <button class="cor-menu__item" role="menuitem"><svg class="cor-ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 2.5h11v11h-11z M2.5 6.5h11 M7 6.5v7"/></svg>Edit layout<kbd>E</kbd></button>
    <div class="cor-menu__sep" role="separator"></div>
    <button class="cor-menu__item cor-menu__item--danger" role="menuitem"><svg class="cor-ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 3.5l9 9 M12.5 3.5l-9 9"/></svg>Remove from view</button>
  </div>
  <div class="cor-menu" role="menu" aria-label="Meta Ads actions">
    <div class="cor-menu__head cor-tag">CH·02 Meta Ads</div>
    <button class="cor-menu__item" role="menuitem"><svg class="cor-ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M13 8a5 5 0 0 1-8.5 3.5 M3 8a5 5 0 0 1 8.5-3.5 M11.5 1.5v3h-3 M4.5 14.5v-3h3"/></svg>Sync now<span class="cor-menu__meta">last 4m</span></button>
    <button class="cor-menu__item" role="menuitem"><svg class="cor-ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 4c0-1.1 2.2-2 5-2s5 .9 5 2-2.2 2-5 2-5-.9-5-2z M3 4v8c0 1.1 2.2 2 5 2s5-.9 5-2V4 M3 8c0 1.1 2.2 2 5 2s5-.9 5-2"/></svg>Manage datasets</button>
    <button class="cor-menu__item" role="menuitem"><svg class="cor-ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M9.5 2.5h4v4 M13.5 2.5L7.5 8.5 M11.5 9.5v4h-9v-9h4"/></svg>Open in Meta Ads Manager</button>
  </div>
</div>
</body>
</html>
