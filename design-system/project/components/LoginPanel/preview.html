<!-- @dsCard group="Auth" height=600 subtitle="Sign in, with error and reset" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>LoginPanel — preview</title></head>
<body>
<div class="cor-login" style="min-height:580px">
  <div class="cor-login__art">
    <span class="cor-wordmark" style="font-size:28px">COR</span>
    <div style="display:grid;gap:var(--space-4);max-width:460px;position:relative;z-index:1"><h1 style="margin:0;font:700 48px/48px var(--font-sans);letter-spacing:-.035em">Every channel.<br>One board.</h1><p class="cor-tag" style="margin:0;color:var(--bg);opacity:.8">Google Ads · Meta Ads · LinkedIn Ads · attributed with HubSpot</p></div>
    <svg viewBox="0 0 240 200" width="240" height="200" aria-hidden="true" style="position:absolute;right:0;bottom:0"><rect x="0" y="140" width="40" height="60" style="fill:var(--cobalt-soft)"/><rect x="56" y="96" width="40" height="104" style="fill:var(--ch-2)"/><rect x="112" y="40" width="48" height="160" style="fill:var(--cobalt)"/><rect x="176" y="0" width="64" height="200" style="fill:var(--flare)"/></svg>
  </div>
  <form class="cor-login__form" onsubmit="event.preventDefault()">
    <div style="display:grid;gap:var(--space-1)"><h2 style="margin:0;font:700 24px/28px var(--font-sans);letter-spacing:-.02em">Sign in to Northwind</h2><span class="cor-help">Use your work email.</span></div>
    <div class="cor-banner cor-banner--failed" role="alert"><svg class="cor-ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2l6.5 12h-13z M8 6.5v3.5 M8 12v.5"/></svg><span>That email and password don't match. Check both and try again.</span></div>
    <label class="cor-fieldset"><span class="cor-fieldset__label"><span class="cor-tag">Work email</span></span><input class="cor-input" id="lg-email" type="email" autocomplete="username" value="dakota@northwind.co"></label>
    <label class="cor-fieldset"><span class="cor-fieldset__label"><span class="cor-tag">Password</span><a class="cor-link" href="#" style="font-size:12px">Forgot password?</a></span><span class="cor-input-wrap"><input class="cor-input" id="lg-pass" type="password" autocomplete="current-password" aria-invalid="true" style="padding-left:var(--space-3)"><button class="cor-input-wrap__end" type="button" aria-label="Show password" style="cursor:pointer"><svg class="cor-ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 8S4 3.5 8 3.5 14.5 8 14.5 8 12 12.5 8 12.5 1.5 8 1.5 8z M8 10a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"/></svg></button></span></label>
    <button class="cor-key cor-key--primary" type="submit" style="justify-content:space-between">Sign in <kbd>⏎</kbd></button>
    <span class="cor-help">New here? Ask your workspace admin for an invite.</span>
  </form>
</div>
</body>
</html>
