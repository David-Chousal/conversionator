<!-- @dsCard group="Inputs" height=210 subtitle="Immediate on/off, shown on Data tab dataset rows" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Switch — preview</title></head>
<body>
<div class="cor-pad">
  <div class="cor-list" style="--cols:72px minmax(0,1fr) 88px 88px;max-width:640px">
    <div class="cor-list__row cor-list__row--head" style="--cols:72px minmax(0,1fr) 88px 88px"><span class="cor-tag">Pull</span><span class="cor-tag">Dataset</span><span class="cor-tag">Records</span><span class="cor-tag">Updated</span></div>
    <div class="cor-list__row"><label class="cor-switch"><input type="checkbox" id="ds-1" checked><span class="cor-switch__state">ON</span></label><span class="cor-list__main"><strong>Campaigns</strong><span>google_ads.campaigns</span></span><span class="cor-num">212</span><span class="cor-tag">4m ago</span></div>
    <div class="cor-list__row"><label class="cor-switch"><input type="checkbox" id="ds-2" checked><span class="cor-switch__state">ON</span></label><span class="cor-list__main"><strong>Ad spend by day</strong><span>google_ads.spend_daily</span></span><span class="cor-num">18,404</span><span class="cor-tag">4m ago</span></div>
    <div class="cor-list__row"><label class="cor-switch"><input type="checkbox" id="ds-3"><span class="cor-switch__state">OFF</span></label><span class="cor-list__main"><strong>Search terms</strong><span>google_ads.search_terms</span></span><span class="cor-num" style="color:var(--ink-muted)">—</span><span class="cor-tag">Never</span></div>
  </div>
</div>
</body>
</html>
