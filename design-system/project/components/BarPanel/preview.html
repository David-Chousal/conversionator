<!doctype html>
<html>
<head><meta charset="utf-8"><title>BarPanel — preview</title></head>
<body>
<div class="cor-pad" style="display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:var(--space-6)">
  <section class="cor-bay">
    <div class="cor-bay__head"><h3 class="cor-bay__title">Conversions by channel</h3><span class="cor-tag">Solid now · hatched prev 30d</span></div>

      <line class="grid" x1="50" x2="610" y1="170" y2="170"/><line class="grid" x1="50" x2="610" y1="116.4" y2="116.4"/><line class="grid" x1="50" x2="610" y1="62.9" y2="62.9"/>
      <text class="tick" x="42" y="174" text-anchor="end">0</text><text class="tick" x="42" y="120" text-anchor="end">500</text><text class="tick" x="42" y="67" text-anchor="end">1,000</text>
      <rect x="80.75" y="57.5" width="36" height="112.5" fill="url(#hatch)" style="stroke:var(--ink-muted)" stroke-width="1"/><rect x="120.75" y="37.1" width="36" height="132.9" style="fill:var(--ch-1)"/><text class="val" x="138.75" y="31.1" text-anchor="middle">1,240</text><text class="bar-label" x="118.75" y="190" text-anchor="middle">Google Ads</text><rect x="218.25" y="72.5" width="36" height="97.5" fill="url(#hatch)" style="stroke:var(--ink-muted)" stroke-width="1"/><rect x="258.25" y="77.9" width="36" height="92.1" style="fill:var(--ch-2)"/><text class="val" x="276.25" y="71.9" text-anchor="middle">860</text><text class="bar-label" x="256.25" y="190" text-anchor="middle">Meta Ads</text><rect x="355.75" y="140.0" width="36" height="30.0" fill="url(#hatch)" style="stroke:var(--ink-muted)" stroke-width="1"/><rect x="395.75" y="136.8" width="36" height="33.2" style="fill:var(--ch-3)"/><text class="val" x="413.75" y="130.8" text-anchor="middle">310</text><text class="bar-label" x="393.75" y="190" text-anchor="middle">LinkedIn Ads</text><rect x="493.25" y="137.9" width="36" height="32.1" fill="url(#hatch)" style="stroke:var(--ink-muted)" stroke-width="1"/><rect x="533.25" y="125.0" width="36" height="45.0" style="fill:var(--ch-4)"/><text class="val" x="551.25" y="119.0" text-anchor="middle">420</text><text class="bar-label" x="531.25" y="190" text-anchor="middle">TikTok Ads</text>
    </svg>
  </section>
  <section class="cor-bay">
    <div class="cor-bay__head"><h3 class="cor-bay__title">CPC distribution</h3><span class="cor-tag">CH·01 · 2,140 clicks</span></div>
    <svg class="cor-trace" viewBox="0 0 310 130" role="img" aria-label="Histogram of cost per click, most clicks between $0.80 and $1.10.">
      <line class="grid" x1="30" x2="294" y1="100" y2="100"/>

      <line x1="140" x2="140" y1="8" y2="100" style="stroke:var(--flare)" stroke-width="1" stroke-dasharray="2 3"/><text class="flag-text" x="146" y="14">MEDIAN $0.91</text>
    </svg>
  </section>
</div>
</body>
</html>
