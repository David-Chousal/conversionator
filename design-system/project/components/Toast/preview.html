<!-- @dsCard group="Feedback" height=280 subtitle="Confirmations and failures after an action" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Toast — preview</title></head>
<body>
<div class="cor-pad" style="display:grid;gap:var(--space-3);justify-items:start">
  <div class="cor-toast cor-toast--ok" role="status"><svg class="cor-ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3 3 7-7"/></svg><div class="cor-toast__body"><strong>Synced 4,120 rows from Google Ads</strong><span>Dashboards updated at 9:46 AM.</span></div><button class="cor-key cor-key--sm cor-key--icon" type="button" aria-label="Dismiss"><svg class="cor-ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 3.5l9 9 M12.5 3.5l-9 9"/></svg></button></div>
  <div class="cor-toast cor-toast--failed" role="alert"><svg class="cor-ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2l6.5 12h-13z M8 6.5v3.5 M8 12v.5"/></svg><div class="cor-toast__body"><strong>Export failed</strong><span>The report timed out at 98%. Your settings are saved.</span><button class="cor-link" type="button" style="justify-self:start;margin-top:4px">Retry export →</button></div><button class="cor-key cor-key--sm cor-key--icon" type="button" aria-label="Dismiss"><svg class="cor-ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 3.5l9 9 M12.5 3.5l-9 9"/></svg></button></div>
  <div class="cor-toast" role="status"><svg class="cor-ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 14.5A6.5 6.5 0 1 0 8 1.5a6.5 6.5 0 0 0 0 13z M8 7v4.5 M8 4.5v.5"/></svg><div class="cor-toast__body"><strong>Invitation sent to maria@northwind.co</strong><span>It expires in 7 days.</span></div><button class="cor-link" type="button">Undo</button></div>
</div>
</body>
</html>
