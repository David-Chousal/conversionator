<!-- @dsCard group="Inputs" height=150 subtitle="Checkboxes and radios" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Choice — preview</title></head>
<body>
<div class="cor-pad" style="display:flex;flex-wrap:wrap;gap:var(--space-8)">
  <fieldset style="border:0;margin:0;padding:0;display:grid;gap:var(--space-2)"><legend class="cor-tag" style="margin-bottom:var(--space-2)">Deliver alerts by</legend>
    <label class="cor-check"><input type="checkbox" id="ch-inapp" checked><span>In-app</span></label>
    <label class="cor-check"><input type="checkbox" id="ch-email" checked><span>Email</span></label>
    <label class="cor-check"><input type="checkbox" id="ch-slack"><span>Slack · #growth</span></label></fieldset>
  <fieldset style="border:0;margin:0;padding:0;display:grid;gap:var(--space-2)"><legend class="cor-tag" style="margin-bottom:var(--space-2)">Role</legend>
    <label class="cor-check"><input type="radio" name="role" id="r-admin"><span>Admin · manages connections, team and workspace</span></label>
    <label class="cor-check"><input type="radio" name="role" id="r-member" checked><span>Member · views, builds reports and alerts</span></label></fieldset>
</div>
</body>
</html>
