<!-- @dsCard group="Overlays" height=420 subtitle="Modal task: invite a member" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Dialog — preview</title></head>
<body>
<div class="cor-scrim" style="min-height:400px;box-sizing:border-box">
  <div class="cor-dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-t">
    <div class="cor-dialog__head"><h2 class="cor-dialog__title" id="dlg-t">Invite to Northwind</h2><button class="cor-key cor-key--sm cor-key--icon" type="button" aria-label="Close"><svg class="cor-ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 3.5l9 9 M12.5 3.5l-9 9"/></svg></button></div>
    <label class="cor-fieldset"><span class="cor-fieldset__label"><span class="cor-tag">Emails</span><span class="cor-tag">Comma separated</span></span>
      <span class="cor-tokens"><span class="cor-token">maria@northwind.co<button type="button" aria-label="Remove"><svg class="cor-ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 3.5l9 9 M12.5 3.5l-9 9"/></svg></button></span><input id="dlg-in" placeholder="Add email…"></span></label>
    <fieldset style="border:0;margin:0;padding:0;display:grid;gap:var(--space-2)"><legend class="cor-tag" style="margin-bottom:var(--space-2)">Role</legend>
      <label class="cor-check"><input type="radio" name="drole" id="d-adm"><span>Admin · manages connections, team and workspace</span></label>
      <label class="cor-check"><input type="radio" name="drole" id="d-mem" checked><span>Member · views, builds reports and alerts</span></label></fieldset>
    <div class="cor-dialog__foot"><button class="cor-key" type="button">Cancel <kbd>Esc</kbd></button><button class="cor-key cor-key--primary" type="button">Send invite <kbd>⌘⏎</kbd></button></div>
  </div>
</div>
</body>
</html>
